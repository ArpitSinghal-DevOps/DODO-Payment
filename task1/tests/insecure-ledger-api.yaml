apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-ledger-api
  namespace: payments
  labels:
    app.kubernetes.io/name: insecure-ledger-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: insecure-ledger-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insecure-ledger-api
    spec:
      containers:
        - name: ledger-api
          image: ledger-api:latest
          env:
            - name: STRIPE_API_KEY
              value: "sk_live_plaintext_should_be_rejected"
            - name: DB_PASSWORD
              value: "plaintext_should_be_rejected"
          ports:
            - containerPort: 8080
