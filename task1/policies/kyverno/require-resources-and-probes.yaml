apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resources-and-probes
  annotations:
    policies.kyverno.io/title: Require Resources and Probes
    policies.kyverno.io/category: Reliability
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-ledger-api-requests-limits-and-probes
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - payments
      exclude:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - payments
              annotations:
                sidecar.istio.io/status: "?*"
      validate:
        message: "ledger-api containers must define CPU/memory requests and limits plus startup, readiness, and liveness probes."
        foreach:
          - list: "request.object.spec.containers[?name=='ledger-api']"
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"
              startupProbe: "?*"
              readinessProbe: "?*"
              livenessProbe: "?*"
    - name: require-reporting-requests-limits-and-probes
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - payments
      exclude:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - payments
              annotations:
                sidecar.istio.io/status: "?*"
      validate:
        message: "reporting containers must define CPU/memory requests and limits plus startup, readiness, and liveness probes."
        foreach:
          - list: "request.object.spec.containers[?name=='reporting']"
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"
              startupProbe: "?*"
              readinessProbe: "?*"
              livenessProbe: "?*"
