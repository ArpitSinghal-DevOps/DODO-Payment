apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-container-hardening
  annotations:
    policies.kyverno.io/title: Require Container Hardening
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-security-context
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - payments
      validate:
        message: "Containers must disable privilege escalation, use a read-only root filesystem, and drop all capabilities."
        foreach:
          - list: "request.object.spec.containers[?name!='istio-proxy']"
            pattern:
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
    - name: require-runtime-default-seccomp
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - payments
      validate:
        message: "Pods must use seccomp RuntimeDefault."
        pattern:
          spec:
            securityContext:
              seccompProfile:
                type: RuntimeDefault
