apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-api-config
  namespace: payments
  labels:
    app.kubernetes.io/name: ledger-api
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: ledger-api
data:
  FLASK_ENV: production
  LOG_LEVEL: info
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
