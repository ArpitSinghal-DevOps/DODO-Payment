apiVersion: v1
kind: Namespace
metadata:
  name: attack
  labels:
    istio-injection: enabled
    app.kubernetes.io/name: attack
    app.kubernetes.io/part-of: ledger-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rogue-client
  namespace: attack
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rogue-client
  namespace: attack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rogue-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rogue-client
    spec:
      serviceAccountName: rogue-client
      automountServiceAccountToken: false
      containers:
        - name: curl
          image: curlimages/curl:8.8.0
          command:
            - sleep
            - infinity
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
