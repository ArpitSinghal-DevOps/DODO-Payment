apiVersion: v1
kind: Namespace
metadata:
  name: legacy
  labels:
    app.kubernetes.io/name: legacy
    app.kubernetes.io/part-of: ledger-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plain-client
  namespace: legacy
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plain-client
  namespace: legacy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plain-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plain-client
    spec:
      serviceAccountName: plain-client
      automountServiceAccountToken: false
      containers:
        - name: curl
          image: curlimages/curl:8.8.0
          command:
            - sleep
            - infinity
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
